  <script>
    (function () {
      var iconUrl = "https://poozr.github.io/wde-assets/LogoAppIcon.png";
      var manifest = {
        name: "WDE Scoreboard",
        short_name: "WDE",
        start_url: window.location.href,
        display: "standalone",
        background_color: "#071526",
        theme_color: "#0C2340",
        icons: [
          { src: iconUrl, sizes: "192x192", type: "image/png", purpose: "any maskable" },
          { src: iconUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }
        ]
      };
      var manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      document.head.appendChild(Object.assign(document.createElement('link'), {
        rel: 'manifest', href: URL.createObjectURL(manifestBlob)
      }));

      if ('serviceWorker' in navigator) {
        var swBlob = new Blob(["self.addEventListener('fetch', function(e) {});"], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(console.error);
      }
    })();
  </script>

  <script>
    (function () {
      'use strict';
      var state = {
        auburnId: '2',
        secGroupId: '8',
        baseUrl: 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard',
        summaryBaseUrl: 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=',
        pollingInterval: 45000,
        pollTimer: null,
        selectedWeek: 'current',
        auburnScoreUnlocked: sessionStorage.getItem('wde_score_unlocked') === 'true',
        liveFirst: localStorage.getItem('wde_live_first') === 'true',
        includeTop25: localStorage.getItem('wde_include_top25') === 'true',
        spoilerExpirationHour: localStorage.getItem('wde_spoiler_hour') !== null ? parseInt(localStorage.getItem('wde_spoiler_hour')) : 3,
        isFetching: false,
        cachedData: null,
        currentHubTeamId: null,
        openAccordions: []
      };

      var dom = {
        auburnSection: document.getElementById('auburnSection'),
        secGamesList: document.getElementById('secGamesList'),
        weekSelector: document.getElementById('weekSelector'),
        sortFinishedToggle: document.getElementById('sortFinishedToggle'),
        includeTop25Toggle: document.getElementById('includeTop25Toggle'),
        spoilerExpirationSelector: document.getElementById('spoilerExpirationSelector'),
        statusModeLabel: document.getElementById('statusModeLabel'),
        lastUpdatedLabel: document.getElementById('lastUpdatedLabel'),
        slateTitleLabel: document.getElementById('slateTitleLabel'),
        btnRefresh: document.getElementById('btnRefresh'),
        btnShare: document.getElementById('btnShare'),
        shareAppContainer: document.getElementById('shareAppContainer')
      };

      function init() {
        dom.sortFinishedToggle.checked = state.liveFirst;
        dom.includeTop25Toggle.checked = state.includeTop25;
        dom.spoilerExpirationSelector.value = state.spoilerExpirationHour;
        
        setupEventListeners();
        fetchScoreboardData();
        startPolling();
      }

      function setupEventListeners() {
        dom.weekSelector.addEventListener('change', function (e) {
          state.selectedWeek = e.target.value;
          state.openAccordions = [];
          fetchScoreboardData();
          closeDrawer();
        });
        
        dom.sortFinishedToggle.addEventListener('change', function(e) {
          state.liveFirst = e.target.checked;
          localStorage.setItem('wde_live_first', state.liveFirst);
          if (state.cachedData) processAndRender(state.cachedData);
        });

        dom.includeTop25Toggle.addEventListener('change', function(e) {
          state.includeTop25 = e.target.checked;
          localStorage.setItem('wde_include_top25', state.includeTop25);
          fetchScoreboardData();
        });

        dom.spoilerExpirationSelector.addEventListener('change', function(e) {
          state.spoilerExpirationHour = parseInt(e.target.value);
          localStorage.setItem('wde_spoiler_hour', state.spoilerExpirationHour);
          if (state.cachedData) processAndRender(state.cachedData);
        });

        dom.btnRefresh.addEventListener('click', function () {
          if (state.isFetching) return;
          var icon = dom.btnRefresh.querySelector('i');
          icon.classList.add('spinning');
          fetchScoreboardData(function () { icon.classList.remove('spinning'); });
        });

        document.addEventListener('visibilitychange', function() {
          if (document.hidden) {
            if (state.pollTimer) clearInterval(state.pollTimer);
          } else {
            fetchScoreboardData();
            startPolling();
          }
        });

        if (navigator.share) {
          dom.shareAppContainer.style.display = 'block';
          dom.btnShare.addEventListener('click', function () {
            navigator.share({
              title: 'WDE Scoreboard',
              text: 'Check out the live Auburn and SEC scores!',
              url: window.location.href
            }).catch(function(err) { console.error('Share failed:', err); });
          });
        }

        document.addEventListener('click', function(e) {
          var logoTarget = e.target.closest('.logo-clickable');
          if (logoTarget) {
            e.preventDefault();
            e.stopPropagation(); 
            var teamId = logoTarget.getAttribute('data-team-id');
            var teamName = logoTarget.getAttribute('data-team-name');
            var teamColor = logoTarget.getAttribute('data-team-color');
            openTeamHubDrawer(teamId, teamName, teamColor);
            return;
          }

          var cardTarget = e.target.closest('.card-clickable');
          if (cardTarget) {
            var targetId = cardTarget.getAttribute('data-target-id');
            var targetEl = document.getElementById(targetId);
            if (targetEl) {
              var bsCollapse = bootstrap.Collapse.getInstance(targetEl);
              if (!bsCollapse) bsCollapse = new bootstrap.Collapse(targetEl, { toggle: false });
              bsCollapse.toggle();
            }
          }
        });

        document.addEventListener('show.bs.collapse', function (e) {
          if (e.target.id && e.target.id.startsWith('stats-')) {
            var gameId = e.target.id.replace('stats-', '');
            var openPanels = document.querySelectorAll('.collapse.show');
            openPanels.forEach(function(panel) {
              if (panel.id !== e.target.id && panel.id.startsWith('stats-')) {
                var bsCollapse = bootstrap.Collapse.getInstance(panel);
                if (bsCollapse) bsCollapse.hide();
              }
            });
            state.openAccordions = [gameId];
            fetchGameSummary(gameId);
          }
        });

        document.addEventListener('hide.bs.collapse', function (e) {
          if (e.target.id && e.target.id.startsWith('stats-')) {
            var gameId = e.target.id.replace('stats-', '');
            state.openAccordions = state.openAccordions.filter(id => id !== gameId);
          }
        });
      }

      function closeDrawer() {
        var offcanvasEl = document.getElementById('settingsDrawer');
        var offcanvasInstance = bootstrap.Offcanvas.getInstance(offcanvasEl);
        if (offcanvasInstance) offcanvasInstance.hide();
      }

      function startPolling() {
        if (state.pollTimer) clearInterval(state.pollTimer);
        state.pollTimer = setInterval(function () {
          if (state.selectedWeek === 'current') fetchScoreboardData();
        }, state.pollingInterval);
      }

      function fetchScoreboardData(callback) {
        state.isFetching = true;
        
        var secUrl = state.baseUrl + '?groups=' + state.secGroupId;
        if (state.selectedWeek !== 'current') secUrl += '&week=' + state.selectedWeek;
        var fetchPromises = [fetch(secUrl).then(res => res.json())];

        if (state.includeTop25) {
          var top25Url = state.baseUrl; 
          if (state.selectedWeek !== 'current') top25Url += '?week=' + state.selectedWeek;
          fetchPromises.push(fetch(top25Url).then(res => res.json()));
        }

        Promise.all(fetchPromises)
          .then(results => {
            var allEvents = [];
            var seenIds = new Set();
            
            results.forEach(data => {
              (data.events || []).forEach(evt => {
                if (!seenIds.has(evt.id)) {
                  seenIds.add(evt.id);
                  allEvents.push(evt);
                }
              });
            });

            var combinedData = { events: allEvents };
            state.cachedData = combinedData;
            processAndRender(combinedData);
            state.isFetching = false;
            if (callback) callback();
          })
          .catch(err => {
            console.error(err);
            state.isFetching = false;
            if (callback) callback();
            Swal.fire({ icon: 'error', title: 'Connection Error', text: 'Unable to fetch scores.', confirmButtonColor: '#E87722' });
          });
      }

      function processAndRender(data) {
        updateHeaderMetadata();
        var events = data.events || [];
        if (!events.length) {
          dom.auburnSection.innerHTML = '';
          dom.secGamesList.innerHTML = '<div class="text-center py-5 text-muted">No games scheduled.</div>';
          return;
        }

        var normalizedGames = events.map(normalizeGameData);
        var auburnGame = null;
        var otherGames = [];

        normalizedGames.forEach(function (game) {
          if (game.homeTeam.id === state.auburnId || game.awayTeam.id === state.auburnId) auburnGame = game;
          else otherGames.push(game);
        });

        var today = new Date().getDay();
        otherGames.sort(function (a, b) {
          if (state.liveFirst) {
            var aIsFinal = a.state === 'post';
            var bIsFinal = b.state === 'post';
            if (aIsFinal && !bIsFinal) return 1;
            if (!aIsFinal && bIsFinal) return -1;
            
            var aIsLive = a.state === 'in';
            var bIsLive = b.state === 'in';
            if (aIsLive && !bIsLive) return -1;
            if (!aIsLive && bIsLive) return 1;
          }
          
          if (today === 0 && !state.liveFirst) {
            var aRanked = a.homeTeam.rank || a.awayTeam.rank ? 1 : 0;
            var bRanked = b.homeTeam.rank || b.awayTeam.rank ? 1 : 0;
            return bRanked - aRanked;
          }
          return new Date(a.date) - new Date(b.date);
        });

        renderAuburnGame(auburnGame);
        renderOtherGames(otherGames);

        state.openAccordions.forEach(function(gameId) {
          fetchGameSummary(gameId);
        });
      }

      function normalizeGameData(event) {
        var comp = (event.competitions && event.competitions[0]) || {};
        var home = (comp.competitors || []).find(c => c.homeAway === 'home') || {};
        var away = (comp.competitors || []).find(c => c.homeAway === 'away') || {};
        var tv = (comp.broadcasts && comp.broadcasts[0] && comp.broadcasts[0].names) ? comp.broadcasts[0].names[0] : '';
        var oddsObj = comp.odds && comp.odds[0] ? comp.odds[0] : null;

        return {
          id: event.id,
          date: event.date, 
          state: (event.status && event.status.type) ? event.status.type.state : 'pre',
          statusDetail: (event.status && event.status.type) ? event.status.type.shortDetail : '',
          tvStation: tv,
          oddsDetails: oddsObj && oddsObj.details ? oddsObj.details : 'TBD',
          oddsOU: oddsObj && oddsObj.overUnder ? oddsObj.overUnder : 'TBD',
          homeTeam: extractTeamDetails(home),
          awayTeam: extractTeamDetails(away),
          gameLeaders: comp.leaders || []
        };
      }

      function extractTeamDetails(competitor) {
        var team = competitor.team || {};
        var rank = (competitor.curatedRank && competitor.curatedRank.current <= 25) ? competitor.curatedRank.current : null;
        return {
          id: team.id,
          name: team.shortDisplayName || team.displayName || 'TBD',
          logo: team.logo || '',
          score: competitor.score || '0',
          rank: rank,
          record: (competitor.records && competitor.records[0]) ? competitor.records[0].summary : '',
          color: team.color || '0C2340',
          seasonLeaders: competitor.leaders || []
        };
      }

      function updateHeaderMetadata() {
        var now = new Date();
        dom.lastUpdatedLabel.textContent = 'Updated ' + now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        var today = now.getDay();
        dom.statusModeLabel.textContent = today === 0 ? 'Sunday Recap' : (today === 6 ? 'Saturday Game Day Live' : 'Upcoming Weekend Slate');
        
        if (dom.slateTitleLabel) {
           dom.slateTitleLabel.textContent = state.includeTop25 ? 'SEC & Top 25 Slate' : 'SEC Slate';
        }
      }

      function renderAuburnGame(game) {
        if (!game) {
          dom.auburnSection.innerHTML = '<div class="game-card p-3 text-center"><div class="fw-bold text-white fs-5">Open Week / Bye</div></div>';
          return;
        }

        var now = new Date();
        var gameDate = new Date(game.date);
        
        var expirationDate = new Date(gameDate);
        expirationDate.setHours(0, 0, 0, 0); 
        expirationDate.setDate(expirationDate.getDate() + 1); 
        expirationDate.setHours(state.spoilerExpirationHour); 
        
        var isSpoilerWindow = now < expirationDate;
        var isLive = game.state === 'in';
        var isRecentFinal = game.state === 'post' && isSpoilerWindow && state.selectedWeek === 'current';
        
        var needsShield = (isLive || isRecentFinal) && !state.auburnScoreUnlocked;

        dom.auburnSection.innerHTML = 
          '<div class="game-card game-card-auburn">' +
            '<div class="auburn-badge-strip">Auburn Matchup</div>' +
            '<div class="p-0 position-relative flex-grow-1 ' + (needsShield ? 'spoiler-container' : '') + '">' +
              (needsShield ? '<div class="spoiler-overlay"><i class="bi bi-shield-lock-fill fs-2 mb-2 text-warning"></i><div class="fw-bold text-white mb-1">Spoiler Shield Active</div><button id="btnRevealAuburn" class="btn-reveal mt-3"><i class="bi bi-eye-fill me-1"></i> Reveal Final Score</button></div>' : '') +
              '<div class="' + (needsShield ? 'spoiler-blur' : '') + '">' + 
                '<div class="p-3 card-clickable" data-target-id="stats-' + game.id + '">' +
                  buildGameHeaderHtml(game, false, true) + 
                  (game.state === 'pre' ? buildPreGameRowHtml(game) : buildLivePostGameRowHtml(game)) +
                  buildStatCollapseHtml(game) +
                '</div>' + 
              '</div>' +
            '</div>' +
            buildTickerHtml(game) +
          '</div>';

        if (needsShield) {
          document.getElementById('btnRevealAuburn').addEventListener('click', function() {
            Swal.fire({
              title: 'Caught up?', text: 'Reveal Auburn score for this session?', icon: 'warning',
              showCancelButton: true, confirmButtonColor: '#E87722', confirmButtonText: 'Yes, reveal score'
            }).then(res => {
              if (res.isConfirmed) {
                state.auburnScoreUnlocked = true;
                sessionStorage.setItem('wde_score_unlocked', 'true');
                if (state.cachedData) fetchScoreboardData();
              }
            });
          });
        }
      }

      function renderOtherGames(games) {
        dom.secGamesList.innerHTML = games.length ? games.map(function(game) {
          var bothRanked = game.homeTeam.rank && game.awayTeam.rank;
          var singleRanked = (game.homeTeam.rank || game.awayTeam.rank) && !bothRanked;
          
          var highlightClass = '';
          if (bothRanked) highlightClass = 'game-card-double-ranked';
          else if (singleRanked) highlightClass = 'game-card-single-ranked';
          
          return '<div class="game-card ' + highlightClass + '">' + 
                 '<div class="p-3 flex-grow-1 card-clickable" data-target-id="stats-' + game.id + '">' + 
                   buildGameHeaderHtml(game, bothRanked) + 
                   (game.state === 'pre' ? buildPreGameRowHtml(game) : buildLivePostGameRowHtml(game)) +
                   buildStatCollapseHtml(game) +
                 '</div>' + 
                 buildTickerHtml(game) + 
                 '</div>';
        }).join('') : '<div class="text-center py-4 text-muted">No games scheduled.</div>';
      }

      function buildGameHeaderHtml(game, doubleRanked, isAuburnGame) {
        var timeLabel = game.state === 'pre' ? formatKickoffTime(game.date) : (game.statusDetail || 'LIVE');
        var badgeClass = game.state === 'in' ? 'status-live' : (game.state === 'post' ? 'status-final' : 'status-scheduled');
        
        var majorNetworks = ['ABC', 'CBS', 'ESPN', 'FOX', 'NBC'];
        var isMajorNetwork = majorNetworks.some(net => game.tvStation && game.tvStation.toUpperCase() === net);
        var tvBadgeClass = isMajorNetwork ? 'bg-danger' : 'bg-secondary';

        return '<div class="d-flex justify-content-between align-items-center mb-3"><div class="d-flex align-items-center gap-2"><span class="status-badge ' + badgeClass + '">' + timeLabel + '</span>' + (game.tvStation ? '<span class="badge ' + tvBadgeClass + '" style="font-size: 0.65rem;">' + game.tvStation + '</span>' : '') + '</div>' + (doubleRanked && !isAuburnGame ? '<span class="badge bg-warning text-dark fw-bold" style="font-size: 0.65rem;">TOP 25 CLASH</span>' : '') + '</div>';
      }

      function buildPreGameRowHtml(game) {
        var teamCol = '<div class="d-flex flex-column gap-3" style="flex: 1;">' + buildTeamRowHtml(game.awayTeam, true) + buildTeamRowHtml(game.homeTeam, true) + '</div>';
        var oddsCol = '<div class="d-flex flex-column justify-content-center text-end ps-3" style="border-left: 1px solid rgba(255,255,255,0.1); min-width: 65px;">' +
                      '<div style="font-size: 0.6rem; color: #adb5bd; font-weight: bold; letter-spacing: 0.5px;">SPREAD</div>' +
                      '<div style="font-size: 0.85rem; font-weight: 900; color: #ffffff;">' + game.oddsDetails + '</div>' +
                      '<div style="font-size: 0.6rem; color: #adb5bd; font-weight: bold; letter-spacing: 0.5px; margin-top: 4px;">O/U</div>' +
                      '<div style="font-size: 0.85rem; font-weight: 900; color: #ffffff;">' + game.oddsOU + '</div>' +
                      '</div>';
        return '<div class="d-flex justify-content-between">' + teamCol + oddsCol + '</div>';
      }

      function buildLivePostGameRowHtml(game) {
        return '<div class="d-flex flex-column gap-3">' + buildTeamRowHtml(game.awayTeam, false) + buildTeamRowHtml(game.homeTeam, false) + '</div>';
      }

      function buildTeamRowHtml(team, isScheduled) {
        var logoHtml = team.logo ? '<img src="' + team.logo + '" class="team-logo logo-clickable" data-team-id="' + team.id + '" data-team-name="' + team.name + '" data-team-color="' + team.color + '">' : '';
        var scoreHtml = isScheduled ? '' : '<div class="team-score text-white">' + team.score + '</div>';
        return '<div class="d-flex justify-content-between align-items-center"><div class="d-flex align-items-center gap-3">' + logoHtml + '<div><div class="team-name text-white">' + (team.rank ? '<span class="rank-badge">#' + team.rank + '</span>' : '') + team.name + '</div><div class="team-record">' + team.record + '</div></div></div>' + scoreHtml + '</div>';
      }

      function buildTickerHtml(game) {
        var fullText = '';
        if (game.state === 'pre') {
          var awayPass = extractSeasonLeader(game.awayTeam.seasonLeaders, 'passing');
          var homePass = extractSeasonLeader(game.homeTeam.seasonLeaders, 'passing');
          var awayRush = extractSeasonLeader(game.awayTeam.seasonLeaders, 'rushing');
          var homeRush = extractSeasonLeader(game.homeTeam.seasonLeaders, 'rushing');
          
          if (!awayPass && !homePass && !awayRush && !homeRush) return ''; 

          var parts = [];
          if (awayPass) parts.push('AWAY PASS: ' + awayPass);
          if (homePass) parts.push('HOME PASS: ' + homePass);
          if (awayRush) parts.push('AWAY RUSH: ' + awayRush);
          if (homeRush) parts.push('HOME RUSH: ' + homeRush);
          fullText = 'SEASON LEADERS &nbsp;&nbsp;&bull;&nbsp;&nbsp; ' + parts.join(' &nbsp;&nbsp;&bull;&nbsp;&nbsp; ');
        } else {
          var pass = extractCategoryStringTicker(game.gameLeaders, 'passing');
          var rush = extractCategoryStringTicker(game.gameLeaders, 'rushing');
          var rec = extractCategoryStringTicker(game.gameLeaders, 'receiving');
          if (!pass && !rush && !rec) return '';
          
          var parts = [];
          if (pass) parts.push('PASS: ' + pass);
          if (rush) parts.push('RUSH: ' + rush);
          if (rec) parts.push('REC: ' + rec);
          fullText = 'TOP OVERALL PERFORMERS &nbsp;&nbsp;&bull;&nbsp;&nbsp; ' + parts.join(' &nbsp;&nbsp;&bull;&nbsp;&nbsp; ');
        }
        return '<div class="ticker-wrap"><div class="ticker">' + fullText + '</div></div>';
      }

      function extractSeasonLeader(leadersArray, categoryName) {
        if (!leadersArray || !leadersArray.length) return null;
        var category = leadersArray.find(function(cat) { return cat.name && cat.name.toLowerCase().includes(categoryName.toLowerCase()); });
        if (category && category.leaders && category.leaders.length > 0) {
          var athlete = category.leaders[0].athlete || {};
          var athleteName = athlete.shortName || athlete.lastName || 'Unknown';
          var statValue = category.leaders[0].displayValue || '0';
          return athleteName + ' (' + statValue + ')';
        }
        return null;
      }

      function extractCategoryStringTicker(leadersArray, categoryName) {
        if (!leadersArray || !leadersArray.length) return null;
        var category = leadersArray.find(function(cat) { return cat.name && cat.name.toLowerCase().includes(categoryName.toLowerCase()); });
        if (category && category.leaders && category.leaders.length > 0) {
          var athlete = category.leaders[0].athlete || {};
          var athleteName = athlete.shortName || athlete.lastName || 'Unknown';
          var statValue = category.leaders[0].displayValue || '0';
          return athleteName + ' (' + statValue + ')';
        }
        return null;
      }

      function buildStatCollapseHtml(game) {
        if (game.state === 'pre') return ''; 
        var isOpen = state.openAccordions.includes(game.id);
        var showClass = isOpen ? 'show' : '';
        return '<div class="collapse mt-3 pt-3 border-top ' + showClass + '" id="stats-' + game.id + '" style="border-color: rgba(255,255,255,0.1) !important;">' +
               '<div id="summary-content-' + game.id + '">' +
               (isOpen ? '<div class="text-center py-2"><div class="spinner-border spinner-border-sm text-warning"></div></div>' : '') +
               '</div>' +
               '</div>';
      }

      function fetchGameSummary(gameId) {
        var container = document.getElementById('summary-content-' + gameId);
        if (container && container.innerHTML.trim() === '') {
          container.innerHTML = '<div class="text-center py-2"><div class="spinner-border spinner-border-sm text-warning"></div></div>';
        }

        fetch(state.summaryBaseUrl + gameId)
          .then(res => res.json())
          .then(data => {
            var contentDiv = document.getElementById('summary-content-' + gameId);
            if (!contentDiv) return;

            var boxscorePlayers = (data.boxscore && data.boxscore.players) ? data.boxscore.players : [];
            var boxscoreTeams = (data.boxscore && data.boxscore.teams) ? data.boxscore.teams : [];
            
            if (boxscorePlayers.length < 2) {
              contentDiv.innerHTML = '<div class="text-center py-2 text-muted" style="font-size:0.7rem;">Detailed stats not yet available.</div>';
              return;
            }

            var team1Players = boxscorePlayers[0];
            var team2Players = boxscorePlayers[1];
            
            var team1StatsArray = (boxscoreTeams.length > 0 && boxscoreTeams[0].statistics) ? boxscoreTeams[0].statistics : [];
            var team2StatsArray = (boxscoreTeams.length > 1 && boxscoreTeams[1].statistics) ? boxscoreTeams[1].statistics : [];

            var html = '<div class="row text-start g-2">' +
                       '<div class="col-6">' +
                       '<div class="fw-bold mb-2 text-uppercase" style="font-size: 0.7rem; color: #adb5bd;">' + (team1Players.team.displayName || team1Players.team.name || 'AWAY') + '</div>' +
                       buildTeamBoxscoreHtml(team1Players) +
                       buildTeamStatsHtml(team1StatsArray) +
                       '</div>' +
                       '<div class="col-6 border-start" style="border-color: rgba(255,255,255,0.1) !important;">' +
                       '<div class="fw-bold mb-2 text-uppercase" style="font-size: 0.7rem; color: #adb5bd;">' + (team2Players.team.displayName || team2Players.team.name || 'HOME') + '</div>' +
                       buildTeamBoxscoreHtml(team2Players) +
                       buildTeamStatsHtml(team2StatsArray) +
                       '</div>' +
                       '</div>';
            contentDiv.innerHTML = html;
          })
          .catch(err => {
            var errDiv = document.getElementById('summary-content-' + gameId);
            if(errDiv) errDiv.innerHTML = '<div class="text-center py-2 text-muted" style="font-size:0.7rem;">Failed to load stats.</div>';
          });
      }

      function buildTeamBoxscoreHtml(teamBoxscore) {
        var pass = extractCategoryFromBoxscore(teamBoxscore, 'passing', 3);
        var rush = extractCategoryFromBoxscore(teamBoxscore, 'rushing', 3);
        var rec = extractCategoryFromBoxscore(teamBoxscore, 'receiving', 3);
        var def = extractCategoryFromBoxscore(teamBoxscore, 'defensive', 2);

        if (!pass && !rush && !rec && !def) return '<div style="font-size: 0.65rem; color: #adb5bd;">No data available.</div>';

        var html = '<div class="d-flex flex-column">';
        if (pass) html += '<div class="stat-line"><span class="fw-bold text-white">PASS:</span><br>' + pass + '</div>';
        if (rush) html += '<div class="stat-line"><span class="fw-bold text-white">RUSH:</span><br>' + rush + '</div>';
        if (rec) html += '<div class="stat-line"><span class="fw-bold text-white">REC:</span><br>' + rec + '</div>';
        if (def) html += '<div class="stat-line"><span class="fw-bold text-white">DEF:</span><br>' + def + '</div>';
        html += '</div>';
        return html;
      }

      function extractCategoryFromBoxscore(boxscoreTeam, categoryName, limit) {
        if (limit === undefined) limit = 3;
        if (!boxscoreTeam || !boxscoreTeam.statistics) return null;
        var category = boxscoreTeam.statistics.find(function(cat) { 
          return cat.name && cat.name.toLowerCase() === categoryName.toLowerCase(); 
        });
        if (category && category.athletes && category.athletes.length > 0) {
          var players = [];
          var loopLimit = Math.min(category.athletes.length, limit);
          for (var i = 0; i < loopLimit; i++) {
            var athleteData = category.athletes[i];
            var athleteName = athleteData.athlete.shortName || athleteData.athlete.lastName || 'Unknown';
            var stats = athleteData.stats || [];
            
            var statString = "";
            if (categoryName === 'passing' && stats.length >= 4) {
              statString = stats[0] + ', ' + stats[1] + ' YDS, ' + stats[3] + ' TD';
            } else if (categoryName === 'rushing' && stats.length >= 4) {
              statString = stats[0] + ' CAR, ' + stats[1] + ' YDS, ' + stats[3] + ' TD';
            } else if (categoryName === 'receiving' && stats.length >= 4) {
              statString = stats[0] + ' REC, ' + stats[1] + ' YDS, ' + stats[3] + ' TD';
            } else if (categoryName === 'defensive' && stats.length >= 4) {
              statString = stats[0] + ' TKL';
              if (stats[3] && stats[3] !== '0' && stats[3] !== '0.0') statString += ', ' + stats[3] + ' SCK';
            } else {
              statString = stats.join(', '); 
            }
            if (statString.includes(', 0 TD')) statString = statString.replace(', 0 TD', '');
            if (i === 0) players.push('<strong>' + athleteName + '</strong> <span style="opacity: 0.85;">(' + statString + ')</span>');
            else players.push('<span class="stat-secondary">' + athleteName + ' (' + statString + ')</span>');
          }
          return players.join('<br>');
        }
        return null;
      }
      
      function getTeamStatValue(statsArray, possibleNames) {
        var stat = null;
        for (var i = 0; i < possibleNames.length; i++) {
          stat = statsArray.find(function(s) { return s.name === possibleNames[i]; });
          if (stat) return stat.displayValue;
        }
        return '-';
      }

      function buildTeamStatsHtml(statsArray) {
        if (!statsArray || statsArray.length === 0) return '';
        var yds = getTeamStatValue(statsArray, ['totalYards', 'netYards', 'totalOffensiveYards']);
        var to = getTeamStatValue(statsArray, ['turnovers']);
        var pen = getTeamStatValue(statsArray, ['totalPenaltiesYards', 'penalties', 'penaltiesYards']); 
        var top = getTeamStatValue(statsArray, ['possessionTime']);
        return '<div class="mt-2 pt-2 border-top" style="border-color: rgba(255,255,255,0.1) !important;">' +
               '<div class="fw-bold mb-2" style="font-size: 0.65rem; color: #E87722; letter-spacing: 0.5px;">TEAM STATS</div>' +
               '<div class="stat-line mb-1"><span class="fw-bold text-white">YDS:</span> ' + yds + '</div>' +
               '<div class="stat-line mb-1"><span class="fw-bold text-white">TO:</span> ' + to + '</div>' +
               '<div class="stat-line mb-1"><span class="fw-bold text-white">PEN:</span> ' + pen + '</div>' +
               '<div class="stat-line mb-1"><span class="fw-bold text-white">TOP:</span> ' + top + '</div>' +
               '</div>';
      }

      function openTeamHubDrawer(teamId, teamName, teamColor) {
        state.currentHubTeamId = teamId;
        var header = document.getElementById('hubDrawerHeader');
        var label = document.getElementById('hubDrawerLabel');
        header.style.backgroundColor = teamColor && teamColor !== '000000' ? '#' + teamColor : '#0C2340';
        label.textContent = teamName.toUpperCase() + ' HUB';

        document.getElementById('pane-injuries').innerHTML = 
          '<div class="text-center py-5 px-3">' +
            '<i class="bi bi-bandaid-fill mb-3" style="font-size: 2.5rem; color: #0C2340; opacity: 0.2;"></i>' +
            '<div class="fw-bold mb-3" style="color: #0C2340;">Injury reports are only available directly on ESPN.</div>' +

          '<div class="text-center py-5 px-3">' +
            '<i class="bi bi-diagram-3-fill mb-3" style="font-size: 2.5rem; color: #0C2340; opacity: 0.2;"></i>' +
            '<div class="fw-bold mb-3" style="color: #0C2340;">Depth chart data is only available directly on ESPN.</div>' +
            '<a href="' + depthUrl + '" target="_blank" rel="noopener noreferrer" class="btn fw-bold text-white w-100" style="background-color: #E87722; letter-spacing: 1px;">VIEW OFFICIAL DEPTH CHART</a>' +

      function fetchTeamSchedule(teamId) {
        var body = document.getElementById('pane-schedule');
        fetch('https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/' + teamId + '/schedule')
          .then(res => res.json())
          .then(data => {
            var events = data.events || [];
            if (!events.length) { body.innerHTML = '<div class="text-center py-4 text-muted">Schedule not available.</div>'; return; }
            
            var html = '<ul class="list-group list-group-flush">';
            events.forEach(function(ev) {
              var comp = (ev.competitions && ev.competitions[0]) ? ev.competitions[0] : null;
              if (!comp) return;
              var competitors = comp.competitors || [];
              var myTeam = competitors.find(c => c.id === teamId) || {};
              var oppTeam = competitors.find(c => c.id !== teamId) || {};
              var oppData = oppTeam.team || {};
              var oppName = oppData.shortDisplayName || oppData.displayName || 'TBA';
              var oppLogo = oppData.logos && oppData.logos.length ? oppData.logos[0].href : '';
              var isHome = myTeam.homeAway === 'home';
              var vsAt = isHome ? 'vs' : '@';
              var d = new Date(ev.date);
              var dateStr = d.toLocaleDateString([], {month: 'short', day: 'numeric'});
              var gameState = (comp.status && comp.status.type) ? comp.status.type.state : 'pre';
              
              var liveMatch = state.cachedData && state.cachedData.events ? state.cachedData.events.find(e => e.id === ev.id) : null;
              var liveMyTeam = null;
              var liveOppTeam = null;
              if (liveMatch && liveMatch.competitions && liveMatch.competitions[0]) {
                var liveCompetitors = liveMatch.competitions[0].competitors || [];
                liveMyTeam = liveCompetitors.find(c => c.id === teamId);
                liveOppTeam = liveCompetitors.find(c => c.id !== teamId);
                gameState = (liveMatch.status && liveMatch.status.type) ? liveMatch.status.type.state : gameState;
              }

              var getScore = function(teamObj, liveTeamObj) {
                if (liveTeamObj && liveTeamObj.score != null) {
                  if (typeof liveTeamObj.score === 'object') return parseInt(liveTeamObj.score.value || 0);
                  return parseInt(liveTeamObj.score || 0);
                }
                if (!teamObj || teamObj.score == null) return 0;
                if (typeof teamObj.score === 'object') return parseInt(teamObj.score.value || 0);
                return parseInt(teamObj.score || 0);
              };
              
              var myScore = getScore(myTeam, liveMyTeam);
              var oppScore = getScore(oppTeam, liveOppTeam);
              var statusStr = '';
              if (gameState === 'post') {
                var wl = myScore > oppScore ? '<span class="text-success fw-bold">W</span>' : (myScore < oppScore ? '<span class="text-danger fw-bold">L</span>' : '<span class="text-warning fw-bold">T</span>');
                statusStr = wl + ' ' + myScore + '-' + oppScore;
              } else if (gameState === 'in') {
                statusStr = '<span class="text-danger fw-bold">LIVE</span> ' + myScore + '-' + oppScore;
              } else {
                statusStr = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
              }
              
              html += '<li class="list-group-item d-flex justify-content-between align-items-center" style="background-color: transparent; border-color: rgba(12,35,64,0.1); padding: 12px 16px;">' +
                      '<div class="d-flex align-items-center gap-2">' +
                        '<div style="width: 16px; font-size: 0.65rem; color: #6c757d; text-align: center; font-weight: bold;">' + vsAt + '</div>' +
                        (oppLogo ? '<img src="' + oppLogo + '" style="width: 24px; height: 24px; object-fit: contain;">' : '') +
                        '<div class="fw-bold" style="font-size: 0.85rem; color: #0C2340;">' + oppName + '</div>' +
                      '</div>' +
                      '<div class="text-end">' +
                        '<div style="font-size: 0.85rem; color: #0C2340; font-weight: bold;">' + statusStr + '</div>' +
                        '<div style="font-size: 0.65rem; color: #6c757d; text-transform: uppercase;">' + dateStr + '</div>' +
                      '</div>' +
                      '</li>';
            });
            html += '</ul>';
            body.innerHTML = html;
          }).catch(err => { body.innerHTML = '<div class="text-center py-4 text-danger">Failed to load schedule.</div>'; });
      }

      function formatKickoffTime(dateString) {
        if (!dateString) return 'TBD';
        var d = new Date(dateString);
        return d.toLocaleDateString([], { weekday: 'short' }) + ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
